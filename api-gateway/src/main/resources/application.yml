server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/v1/auth/{*path}
          - id: accounting-service-clients
            uri: lb://ACCOUNTING-SERVICE
            predicates:
              - Path=/api/v1/clients/{*path}
          - id: accounting-service-suppliers
            uri: lb://ACCOUNTING-SERVICE
            predicates:
              - Path=/api/v1/suppliers/{*path}
          - id: accounting-service-bills
            uri: lb://ACCOUNTING-SERVICE
            predicates:
              - Path=/api/v1/bills/{*path}
          - id: accounting-service-profile
            uri: lb://ACCOUNTING-SERVICE
            predicates:
              - Path=/api/v1/profile/{*path}
          - id: accounting-service-profiles
            uri: lb://ACCOUNTING-SERVICE
            predicates:
              - Path=/api/v1/profiles/{*path}
          - id: accounting-service-expenses
            uri: lb://ACCOUNTING-SERVICE
            predicates:
              - Path=/api/v1/expenses/{*path}
          - id: accounting-service-purchases
            uri: lb://ACCOUNTING-SERVICE
            predicates:
              - Path=/api/v1/purchases/{*path}
          - id: accounting-service-recurring
            uri: lb://ACCOUNTING-SERVICE
            predicates:
              - Path=/api/v1/recurring/{*path}
          - id: accounting-service-receipts
            uri: lb://ACCOUNTING-SERVICE
            predicates:
              - Path=/api/v1/receipts/{*path}
          - id: accounting-service-templates
            uri: lb://ACCOUNTING-SERVICE
            predicates:
              - Path=/api/v1/templates/{*path}
          - id: inventory-service-products
            uri: lb://INVENTORY-SERVICE
            predicates:
              - Path=/api/v1/products/{*path}
          - id: inventory-service-barcodes
            uri: lb://INVENTORY-SERVICE
            predicates:
              - Path=/api/v1/barcodes/{*path}
          - id: inventory-service-inventory
            uri: lb://INVENTORY-SERVICE
            predicates:
              - Path=/api/v1/inventory/{*path}
          - id: monolith-backend
            uri: lb://MONOLITH-BACKEND
            predicates:
              - Path=/api/{*path}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
